name: Android application
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: android_test
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: ismo_android_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U android_test -d ismo_android_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      ISMO_E2E: 'true'
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3001/api
      MOBILE_TEST_API_URL: http://127.0.0.1:3001/api
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: android_test
      DATABASE_PASSWORD: ephemeral_ci_password
      DATABASE_NAME: ismo_android_test
      DATABASE_SSL: 'false'
      CORS_ORIGINS: http://127.0.0.1:3000
      JWT_ACCESS_TOKEN_TTL_SECONDS: '3600'
      PORT: '3001'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare native dependencies
        working-directory: mobile
        run: |
          npm install
          npx expo install --check
      - name: Capture dependency review
        if: always()
        working-directory: mobile
        run: |
          node -e "const fs = require('fs'); if (fs.existsSync('package-lock.json')) console.log('MOBILE_LOCKFILE=' + JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))));"
          npm audit --json > audit.json || true
          node -e "const r = require('./audit.json'); console.log('AUDIT_SUMMARY=' + JSON.stringify({metadata:r.metadata,vulnerabilities:r.vulnerabilities}));"
      - name: Lint, types and session checks
        working-directory: mobile
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Bundle Android application
        working-directory: mobile
        run: npm run export
      - name: Prepare real backend
        run: |
          node -e "const fs = require('fs'); const secret = require('crypto').randomBytes(48).toString('hex'); console.log('::add-mask::' + secret); fs.appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET=' + secret + '\n');"
          cd backend
          npm ci
          npm run build
      - name: Start backend and verify shared API
        run: |
          cd backend
          npm run start:prod > /tmp/ismo-api.log 2>&1 &
          cd ../mobile
          node scripts/wait-for-url.cjs http://127.0.0.1:3001/api/health
          npm run test:integration
      - name: Prepare web browser for cross-platform verification
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium
          npm run dev > /tmp/ismo-web.log 2>&1 &
          cd ../mobile
          node scripts/wait-for-url.cjs http://127.0.0.1:3000
      - name: Generate Android project and debug APK
        working-directory: mobile
        run: |
          npm run prebuild:android
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --max-workers=2
      - name: Prepare native UI verification
        run: |
          sudo chmod 666 /dev/kvm
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          cd mobile
          npx expo start --localhost --port 8081 > /tmp/ismo-metro.log 2>&1 &
          node scripts/wait-for-url.cjs http://127.0.0.1:8081/status
      - name: Verify native Android flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb reverse tcp:8081 tcp:8081
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --env TEST_EMAIL=android-ui-${{ github.run_id }}@example.test --test-output-dir mobile/native-results --debug-output mobile/native-results mobile/.maestro/core-flow.yaml
            TEST_EMAIL=android-ui-${{ github.run_id }}@example.test node mobile/scripts/cross-platform.cjs after-native
            maestro test --test-output-dir mobile/native-results --debug-output mobile/native-results mobile/.maestro/sync-flow.yaml
            TEST_EMAIL=android-ui-${{ github.run_id }}@example.test node mobile/scripts/cross-platform.cjs after-sync
            maestro test --test-output-dir mobile/native-results --debug-output mobile/native-results mobile/.maestro/logout-flow.yaml
      - name: Capture native review images
        if: always()
        run: node mobile/scripts/review-images.cjs
      - name: Save native verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-verification
          path: |
            mobile/native-results
            mobile/audit.json
            /tmp/ismo-metro.log
            /tmp/ismo-api.log
            /tmp/ismo-web.log
          retention-days: 7
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_PUBLIC_API_BASE_URL: https://ismo-development.onrender.com/api
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install and generate Android project
        working-directory: mobile
        run: |
          npm install
          npm run prebuild:android
      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2
      - name: Check deployed backend health
        continue-on-error: true
        run: |
          node -e "(async () => { const response = await fetch('https://ismo-development.onrender.com/api/health', {signal: AbortSignal.timeout(90000)}); const value = await response.json(); console.log('DEPLOYED_HEALTH=' + JSON.stringify(value)); if (!response.ok || value.data?.status !== 'ok' || value.data?.database !== 'up') process.exit(1); })().catch(() => { console.error('Deployed backend health could not be verified.'); process.exit(1); });"
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ismo-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
