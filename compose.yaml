services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in backend/.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in backend/.env}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in backend/.env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
